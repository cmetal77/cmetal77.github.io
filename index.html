
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">
    <title>고객 관리 & 지도 서비스</title>

    <!-- 카카오 지도 API: 발급받은 JavaScript 키 입력 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=452044976c6f8980378450013d49ce90&autoload=false"></script>

    <!-- Google API JavaScript Client -->
    <script async defer
        src="https://apis.google.com/js/api.js"
        onload="this.onload=function(){};handleClientLoad()"
        onreadystatechange="if (this.readyState === 'complete') this.onload()"></script>

    <style>
        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            overflow: hidden;
        }

        /* 로그인 */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,.2);
            max-width: 90%;
            width: 340px;
        }

        .login-btn {
            background: #4285F4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }

        /* 메인 레이아웃 */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .main-tabs {
            display: flex;
            flex: 0 0 auto;
            background: white;
            border-bottom: 2px solid #e9ecef;
            position: relative;
            z-index: 1000;
        }

        .main-tab-btn {
            flex: 1;
            padding: 14px 0;
            text-align: center;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #6c757d;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .main-tab-btn.active {
            color: #0052FF;
            border-bottom-color: #0052FF;
        }

        .tab-content {
            flex: 1 1 0;
            display: none;
            min-height: 0;
            overflow: hidden;
        }

        .tab-content.active { display: block; }

        /* 고객 목록 */
        #list-tab-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 15px;
        }

        .sub-tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 10px;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            flex: 0 0 auto;
        }

        .sub-tab-btn {
            padding: 8px 16px;
            background: #e9ecef;
            color: #495057;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .sub-tab-btn.active {
            background: #0052FF;
            color: white;
        }

        .table-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            vertical-align: middle;
            border-bottom: 1px solid #dee2e6;
        }

        th {
            background: #f1f3f5;
            position: sticky;
            top: 0;
            font-weight: bold;
            color: #495057;
        }

        tr:hover { background-color: #f8f9fa; }

        .navigation-cell { vertical-align: middle; }

        .table-nav-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }

        .table-nav-btn {
            display: block;
            width: 100%;
            min-height: 44px;
            padding: 10px 8px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 카카오 지도 */
        #tab-map {
            position: relative;
            padding: 0;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* 요일별 거래처 핀 */
        .customer-pin-wrap {
            background: transparent;
            border: 0;
        }

        .customer-pin {
            width: 24px;
            height: 24px;
            border: 2px solid white;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 1px 4px rgba(0,0,0,.45);
        }

        .customer-pin::after {
            content: "";
            display: block;
            width: 8px;
            height: 8px;
            margin: 6px auto;
            background: white;
            border-radius: 50%;
        }

        /* 핀 옆 거래처명 */
        .customer-name-label {
            display: inline-block;
            background: rgba(255,255,255,.96);
            border: 1px solid #d0d7de;
            border-radius: 4px;
            box-shadow: 0 1px 3px rgba(0,0,0,.2);
            color: #222;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 6px;
            white-space: nowrap;
            pointer-events: none;
        }

        /* 현재 위치 */
        .current-location-dot {
            width: 18px;
            height: 18px;
            background: #1677ff;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 7px rgba(22,119,255,.2),
                        0 1px 5px rgba(0,0,0,.35);
        }

        /* 거래처 정보창 */
        .info-popup {
            min-width: 220px;
            padding: 12px;
            color: #222;
            font-family: sans-serif;
        }

        .info-popup h3 {
            margin: 7px 0;
            font-size: 16px;
        }

        .info-popup p {
            margin: 0 0 10px;
            font-size: 13px;
            color: #666;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            background: #e9ecef;
            color: #333;
        }

        .nav-btn-group {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            flex: 1;
            padding: 9px 5px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-naver { background: #03C75A; }
        .btn-tmap { background: #0052FF; }

        /* 현재 위치 버튼 */
        #my-location-btn {
            position: absolute;
            right: 12px;
            bottom: 25px;
            z-index: 10;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,.2);
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>고객 관리 서비스</h2>
        <p>구글 시트 연동을 위해 로그인하세요.</p>
        <button class="login-btn" onclick="handleAuthClick()">
            Google 계정으로 로그인
        </button>
    </div>
</div>

<div id="app-container">

    <div class="main-tabs">
        <button class="main-tab-btn active"
                onclick="switchMainTab('list')">
            고객 목록
        </button>
        <button class="main-tab-btn"
                onclick="switchMainTab('map')">
            고객 지도
        </button>
    </div>

    <div id="tab-list" class="tab-content active">
        <div id="list-tab-view">
            <div id="sub-tabs" class="sub-tabs-container"></div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>거래처명</th>
                            <th style="width:110px;">길안내</th>
                        </tr>
                    </thead>
                    <tbody id="customer-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="tab-map" class="tab-content">
        <div id="map"></div>
        <button id="my-location-btn" onclick="goToMyLocation()">
            ◎ 내 위치
        </button>
    </div>

</div>

<script>
    // ==========================================
    // 설정
    // ==========================================
    const API_KEY =
        'AIzaSyCuQF04KL4UTt24Nlhoj8fDT9_zetDHfes';

    const CLIENT_ID =
        '948214777302-hp55blfsm3kqf1v36k504pd43m32iqi5.apps.googleusercontent.com';

    const SPREADSHEET_ID =
        '1_dSzaR0zIuM4G0JTi_J8860C6EUyFsqWhn45iS8KxxY';

    const SHEET_NAME = '거래처';
    const SCOPES =
        'https://www.googleapis.com/auth/spreadsheets.readonly';

    let gapiReady = false;
    let customerData = [];
    let map;
    let markers = [];
    let labelOverlays = [];
    let currentFilter = '전체';
    let currentLocationMarker = null;
    let currentLocation = null;
    let currentLocationRequested = false;
    let infoWindow = null;

    // dow별 색상
    const PIN_COLORS = [
        '#E53935', // 월
        '#1E88E5', // 화
        '#43A047', // 수
        '#8E24AA', // 목
        '#FB8C00', // 금
        '#00897B',
        '#6D4C41',
        '#3949AB',
        '#D81B60',
        '#546E7A'
    ];

    const DOW_MAP = {
        '1': '월',
        '2': '화',
        '3': '수',
        '4': '목',
        '5': '금'
    };

    const divisionColorMap = new Map();

    function getDivisionColor(division) {
        if (!divisionColorMap.has(division)) {
            const color =
                PIN_COLORS[divisionColorMap.size % PIN_COLORS.length];

            divisionColorMap.set(division, color);
        }

        return divisionColorMap.get(division);
    }

    // HTML 삽입 시 특수문자 처리
    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    // ==========================================
    // 초기화
    // ==========================================
    window.onload = () => {
        initMap();
    };

    // ==========================================
    // Google 로그인 / 자동 로그인
    // ==========================================
    function handleClientLoad() {
        gapi.load('client:auth2', initGoogleAuth);
    }

    function initGoogleAuth() {
        gapi.client.init({
            apiKey: API_KEY,
            clientId: CLIENT_ID,
            scope: SCOPES,
            discoveryDocs: [
                'https://sheets.googleapis.com/$discovery/rest?version=v4'
            ]
        }).then(function () {
            gapiReady = true;

            const auth = gapi.auth2.getAuthInstance();

            auth.isSignedIn.listen(updateSignInStatus);

            // 핵심:
            // 이미 Google 로그인 상태가 브라우저에 남아 있으면
            // 로그인 버튼을 누르지 않고 바로 고객관리 화면으로 진입합니다.
            updateSignInStatus(auth.isSignedIn.get());

        }).catch(function (error) {
            console.error('Google API 초기화 오류:', error);
            console.error('상세 오류:', error?.result || error?.error || error);

            alert(
                'Google 인증 라이브러리를 초기화하지 못했습니다.\n\n' +
                '브라우저 콘솔(F12)의 오류 내용을 확인해 주세요.'
            );
        });
    }

    function handleAuthClick() {
        if (!gapiReady || !gapi.auth2) {
            alert('Google 인증 라이브러리를 아직 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
            return;
        }

        const auth = gapi.auth2.getAuthInstance();

        if (auth.isSignedIn.get()) {
            updateSignInStatus(true);
            return;
        }

        auth.signIn().then(function () {
            updateSignInStatus(true);
        }).catch(function (error) {
            console.error('Google 로그인 오류:', error);
            alert('Google 로그인에 실패했습니다.');
        });
    }

    function updateSignInStatus(isSignedIn) {
        const overlay = document.getElementById('login-overlay');

        if (isSignedIn) {
            overlay.style.display = 'none';
            fetchSheetData();
        } else {
            overlay.style.display = 'flex';
        }
    }

    // ==========================================
    // Google Sheets 데이터
    // ==========================================
    async function fetchSheetData() {
        try {
            const response =
                await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: SHEET_NAME
                });

            const rows = response.result.values || [];

            if (rows.length < 2) {
                alert('시트에 데이터가 없습니다.');
                return;
            }

            const headers = rows[0].map(h => (h || '').trim());

            const idxName = headers.indexOf('거래처명');
            const idxAddr = headers.indexOf('주소');
            const idxDow = headers.indexOf('dow');
            const idxLat = headers.indexOf('x');
            const idxLng = headers.indexOf('y');
            const idxDeleted = headers.indexOf('deleted');
            const idxShowMap = headers.indexOf('지도 표시');

            customerData = [];

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];

                const isDeleted = idxDeleted !== -1
                    ? String(row[idxDeleted] || '').trim()
                    : '0';

                const showMapVal = idxShowMap !== -1
                    ? String(row[idxShowMap] || '').trim()
                    : '0';

                if (isDeleted === '1' || showMapVal === '0') {
                    continue;
                }

                const rawDow = idxDow !== -1
                    ? String(row[idxDow] || '').trim()
                    : '';

                const category =
                    DOW_MAP[rawDow] || (rawDow || '미분류');

                const lat = idxLat !== -1
                    ? parseFloat(row[idxLat])
                    : NaN;

                const lng = idxLng !== -1
                    ? parseFloat(row[idxLng])
                    : NaN;

                customerData.push({
                    name: idxName !== -1 ? (row[idxName] || '') : '',
                    address: idxAddr !== -1 ? (row[idxAddr] || '') : '',
                    lat,
                    lng,
                    category,
                    showMap: showMapVal
                });
            }

            renderSubTabs();
            renderTable('전체');
            renderMapMarkers();

        } catch (err) {
            console.error(err);

            const message =
                err?.result?.error?.message ||
                err?.message ||
                '데이터 로딩 실패';

            alert('시트 데이터를 불러오는데 실패했습니다: ' + message);
        }
    }

    // ==========================================
    // 고객 목록의 요일 탭
    // ==========================================
    function renderSubTabs() {
        const dowOrder = ['월', '화', '수', '목', '금'];

        const uniqueCategories = Array.from(
            new Set(customerData.map(item => item.category))
        );

        uniqueCategories.sort((a, b) => {
            const indexA = dowOrder.indexOf(a);
            const indexB = dowOrder.indexOf(b);

            if (indexA !== -1 && indexB !== -1) {
                return indexA - indexB;
            }

            if (indexA !== -1) return -1;
            if (indexB !== -1) return 1;

            return a.localeCompare(b);
        });

        const container = document.getElementById('sub-tabs');
        container.innerHTML = '';

        ['전체', ...uniqueCategories].forEach(cat => {
            const btn = document.createElement('button');

            btn.className =
                'sub-tab-btn' + (cat === '전체' ? ' active' : '');

            btn.textContent = cat;

            btn.onclick = () => {
                document.querySelectorAll('.sub-tab-btn')
                    .forEach(b => b.classList.remove('active'));

                btn.classList.add('active');
                currentFilter = cat;
                renderTable(cat);
            };

            container.appendChild(btn);
        });
    }

    // ==========================================
    // 고객 목록 표
    // ==========================================
    function renderTable(filterCategory) {
        const tbody =
            document.getElementById('customer-table-body');

        tbody.innerHTML = '';

        const filteredData = filterCategory === '전체'
            ? customerData
            : customerData.filter(
                item => item.category === filterCategory
            );

        if (filteredData.length === 0) {
            const tr = document.createElement('tr');
            const td = document.createElement('td');

            td.colSpan = 2;
            td.style.textAlign = 'center';
            td.style.color = '#888';
            td.textContent = '해당하는 고객이 없습니다.';

            tr.appendChild(td);
            tbody.appendChild(tr);
            return;
        }

        filteredData.forEach(item => {
            const tr = document.createElement('tr');
            const nameTd = document.createElement('td');
            const navTd = document.createElement('td');

            const strong = document.createElement('strong');
            strong.textContent = item.name;

            const br = document.createElement('br');
            const address = document.createElement('span');

            address.style.fontSize = '13px';
            address.style.color = '#555';
            address.textContent = item.address;

            nameTd.append(strong, br, address);

            navTd.className = 'navigation-cell';

            const hasCoords = isValidCoords(item);

            if (hasCoords) {
                const group = document.createElement('div');
                group.className = 'table-nav-group';

                const naverBtn = document.createElement('button');
                naverBtn.className = 'table-nav-btn btn-naver';
                naverBtn.textContent = '네이버';
                naverBtn.onclick = () =>
                    openNaverNavi(item.lat, item.lng, item.name);

                const tmapBtn = document.createElement('button');
                tmapBtn.className = 'table-nav-btn btn-tmap';
                tmapBtn.textContent = 'TMAP';
                tmapBtn.onclick = () =>
                    openTmap(item.lat, item.lng, item.name);

                group.append(naverBtn, tmapBtn);
                navTd.appendChild(group);
            } else {
                const span = document.createElement('span');
                span.style.fontSize = '11px';
                span.style.color = '#aaa';
                span.textContent = '좌표없음';
                navTd.appendChild(span);
            }

            tr.append(nameTd, navTd);
            tbody.appendChild(tr);
        });
    }

    function isValidCoords(item) {
        return Number.isFinite(item.lat) &&
               Number.isFinite(item.lng) &&
               item.lat >= -90 && item.lat <= 90 &&
               item.lng >= -180 && item.lng <= 180;
    }

    // ==========================================
    // 카카오 지도 초기화
    // ==========================================
    function initMap() {
        const container = document.getElementById('map');

        map = new kakao.maps.Map(container, {
            center: new kakao.maps.LatLng(37.5665, 126.9780),
            level: 5
        });

        infoWindow = new kakao.maps.InfoWindow({
            removable: true,
            zIndex: 20
        });

        // 지도 클릭 시 열린 정보창 닫기
        kakao.maps.event.addListener(map, 'click', () => {
            infoWindow.close();
        });
    }

    // ==========================================
    // 지도 마커 및 거래처명 렌더링
    // ==========================================
    function renderMapMarkers() {
        if (!map) return;

        markers.forEach(marker => marker.setMap(null));
        labelOverlays.forEach(overlay => overlay.setMap(null));

        markers = [];
        labelOverlays = [];

        const bounds = new kakao.maps.LatLngBounds();

        customerData.forEach(item => {
            if (!isValidCoords(item) || item.showMap !== '1') {
                return;
            }

            const position =
                new kakao.maps.LatLng(item.lat, item.lng);

            bounds.extend(position);

            const pinColor = getDivisionColor(item.category);

            const pinContent = `
                <div class="customer-pin-wrap">
                    <div class="customer-pin"
                         style="background:${pinColor};"></div>
                </div>
            `;

            const pinOverlay = new kakao.maps.CustomOverlay({
                position,
                content: pinContent,
                xAnchor: 0.5,
                yAnchor: 1,
                zIndex: 5,
                clickable: true
            });

            pinOverlay.setMap(map);
            markers.push(pinOverlay);

            // 거래처명 상시 표시
            const labelContent = document.createElement('div');
            labelContent.className = 'customer-name-label';
            labelContent.textContent = item.name || '이름 없음';

            const labelOverlay = new kakao.maps.CustomOverlay({
                position,
                content: labelContent,
                xAnchor: 0,
                yAnchor: 0.5,
                zIndex: 4
            });

            labelOverlay.setMap(map);
            labelOverlays.push(labelOverlay);

            // 핀 클릭 시 정보창 표시
            labelContent.style.cursor = 'default';

            pinContentClick(pinOverlay, item, position);
        });

        // 최초 지도 범위는 거래처 좌표를 기준으로 설정.
        // 현재 위치를 가져오면 현재 위치 중심으로 이동합니다.
        if (!currentLocationRequested) {
            if (customerData.some(
                item => isValidCoords(item) && item.showMap === '1'
            )) {
                map.setBounds(bounds);
            }

            requestCurrentLocation();
        }
    }

    function pinContentClick(overlay, item, position) {
        // 카카오 CustomOverlay의 content는 HTML 문자열이므로
        // 문자열을 DOM 요소로 변환한 뒤 이벤트를 연결합니다.
        const content = document.createElement('div');

        content.innerHTML = `
            <div class="customer-pin-wrap">
                <div class="customer-pin"
                    style="background:${getDivisionColor(item.category)};">
                </div>
            </div>
        `;

        const pin = content.querySelector('.customer-pin');

        if (pin) {
            pin.style.cursor = 'pointer';

            pin.addEventListener('click', event => {
                event.stopPropagation();
                showCustomerInfo(item, position);
            });
        }

        // 기존 오버레이에 DOM 요소를 설정합니다.
        overlay.setContent(content);
    }

    // ==========================================
    // 거래처 정보창
    // ==========================================
    function showCustomerInfo(item, position) {
        const content = document.createElement('div');
        content.className = 'info-popup';

        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = item.category;

        const title = document.createElement('h3');
        title.textContent = item.name || '이름 없음';

        const address = document.createElement('p');
        address.textContent = item.address || '주소 없음';

        const group = document.createElement('div');
        group.className = 'nav-btn-group';

        const naverBtn = document.createElement('button');
        naverBtn.className = 'nav-btn btn-naver';
        naverBtn.textContent = '네이버 지도';
        naverBtn.onclick = () =>
            openNaverNavi(item.lat, item.lng, item.name);

        const tmapBtn = document.createElement('button');
        tmapBtn.className = 'nav-btn btn-tmap';
        tmapBtn.textContent = 'TMAP';
        tmapBtn.onclick = () =>
            openTmap(item.lat, item.lng, item.name);

        group.append(naverBtn, tmapBtn);
        content.append(badge, title, address, group);

        infoWindow.setContent(content);
        infoWindow.setPosition(position);
        infoWindow.open(map);
    }

    // ==========================================
    // 현재 위치
    // ==========================================
    function requestCurrentLocation() {
        // 최초 위치 요청이 진행됐으면 중복 요청 방지
        // 단, 내 위치 버튼을 누르면 새로 조회
        if (currentLocationRequested && !forceRefresh) return;

        currentLocationRequested = true;

        if (!navigator.geolocation) {
            console.warn('이 브라우저는 위치 정보를 지원하지 않습니다.');
            alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
            return;
        }

        navigator.geolocation.getCurrentPosition(
            position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                // 최신 위치로 갱신
                currentLocation = new kakao.maps.LatLng(lat, lng);

                // 기존 위치 마커를 최신 위치로 이동
                showCurrentLocation();

                // 지도도 최신 위치로 이동
                map.setCenter(currentLocation);
                map.setLevel(5);
            },
            error => {
                console.warn(
                    '현재 위치를 가져오지 못했습니다:',
                    error.message
                );

                alert(
                    '현재 위치를 가져오지 못했습니다. ' +
                    '위치 권한과 GPS 상태를 확인해 주세요.'
                );
            },
            {
                enableHighAccuracy: true,
                timeout: 15000,

                // 캐시된 위치 대신 새 위치를 요청
                maximumAge: 0
            }
        );
    }

    function showCurrentLocation() {
        if (!currentLocation || !map) return;

        if (currentLocationMarker) {
            currentLocationMarker.setMap(null);
        }

        const content = document.createElement('div');
        content.className = 'current-location-dot';
        content.title = '현재 위치';

        currentLocationMarker = new kakao.maps.CustomOverlay({
            position: currentLocation,
            content,
            xAnchor: 0.5,
            yAnchor: 0.5,
            zIndex: 100
        });

        currentLocationMarker.setMap(map);
    }

   function goToMyLocation() {
    if (!map) {
        alert('지도가 아직 준비되지 않았습니다.');
        return;
    }

    if (!navigator.geolocation) {
        alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
        return;
    }

    const btn = document.getElementById('my-location-btn');
    const originalText = btn.textContent;

    btn.textContent = '위치 확인 중...';
    btn.disabled = true;

    navigator.geolocation.getCurrentPosition(
        position => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            // 최신 GPS 좌표로 현재 위치 갱신
            currentLocation =
                new kakao.maps.LatLng(lat, lng);

            // 현재 위치 마커 갱신
            showCurrentLocation();

            // 지도 크기와 중심, 확대 수준 갱신
            map.relayout();
            map.setLevel(5);
            map.setCenter(currentLocation);

            btn.textContent = originalText;
            btn.disabled = false;
        },
        error => {
            let message = '현재 위치를 가져오지 못했습니다.';

            if (error.code === 1) {
                message =
                    '위치 권한이 거부되었습니다. 브라우저의 위치 권한을 확인해 주세요.';
            } else if (error.code === 2) {
                message =
                    '현재 위치를 확인할 수 없습니다. GPS 또는 네트워크 상태를 확인해 주세요.';
            } else if (error.code === 3) {
                message =
                    '위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.';
            }

            alert(message);

            btn.textContent = originalText;
            btn.disabled = false;
        },
        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        }
    );
}

    // ==========================================
    // 메인 탭 전환
    // ==========================================
    function switchMainTab(tabName) {
        document.querySelectorAll('.main-tab-btn')
            .forEach(btn => btn.classList.remove('active'));

        document.querySelectorAll('.tab-content')
            .forEach(content => content.classList.remove('active'));

        if (tabName === 'list') {
            document.querySelectorAll('.main-tab-btn')[0]
                .classList.add('active');

            document.getElementById('tab-list')
                .classList.add('active');
        } else {
            document.querySelectorAll('.main-tab-btn')[1]
                .classList.add('active');

            document.getElementById('tab-map')
                .classList.add('active');

            setTimeout(() => {
                if (map) {
                    map.relayout();

                    // 지도 탭에 들어올 때 현재 위치 중심으로 표시
                    if (currentLocation) {
                        map.setCenter(currentLocation);
                    }
                }
            }, 100);
        }
    }

    // ==========================================
    // 네이버 지도 길 안내
    // ==========================================
    function openNaverNavi(lat, lng, name) {
        const url =
            `nmap://route/car?dlat=${lat}&dlng=${lng}` +
            `&dname=${encodeURIComponent(name)}` +
            `&appname=myCustomerMap`;

        window.location.href = url;
    }

    // ==========================================
    // TMAP 길 안내
    // ==========================================
    function openTmap(lat, lng, name) {
        const url =
            `tmap://route?goalname=${encodeURIComponent(name)}` +
            `&goalx=${lng}&goaly=${lat}`;

        window.location.href = url;
    }
</script>
